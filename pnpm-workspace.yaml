packages:
  # core libs
  - "core/*"
  # user plugins
  - "plugins/*"
  # deployable applications
  - "apps/*"

allowBuilds:
  '@parcel/watcher': true
  '@sveltejs/kit': true
  cbor-extract: true
  esbuild: true
  roaring: true

# sometimes dependencies dont update their ts
# since dev dep, always safe to override
peerDependencyRules:
  allowedVersions:
    typescript: "6"

catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^26.5.1
  "@types/pg": ^8.11.10
  "eslint": ^10.10.0
  "@nats-io/transport-node": ^3.4.0
  "@nats-io/jetstream": ^3.4.0
  "typescript": "^6.0.3"
  "cbor-x": ^1.6.0
  "typescript-eslint": ^8.70.0
  "@typescript-eslint/parser": ^8.70.0
  "tsx": ^4.19.1
  "ajv": ^8.17.1
  "ajv-formats": "^3.0.1"
  "handlebars": "^4.7.8"
  "esbuild": ^0.28.2
  "kysely": ^0.29.5
  "ky": ^2.1.0
  "pg": ^8.23.0
  "awilix": ^13.0.5
  "fastify": ^5.12.4
  "@fastify/swagger": ^9.8.1
  "@fastify/formbody": "^9.0.0"
  "pino-pretty": ^13.0.0
  "@sinclair/typebox": ^0.34.52
  "vitest": ^5.0.0
  "nanoid": ^6.0.1
  "p-limit": ^7.3.2
  "roaring": ^2.7.0
  "@vitest/coverage-v8": ^5.0.0
  "vitest-mock-extended": ^5.1.1
  "openapi-typescript": "^7.13.0"
  "openapi-fetch": "^0.13.4"
  "expr-eval": "npm:expr-eval-fork@^3.0.3"
